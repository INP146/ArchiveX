# Image-only deployment for ArchiveX releases published to GitHub Container Registry.
name: archivex

x-archivex-environment: &archivex-environment
  TWSCRAPE_SESSION_PATH: /data/twscrape
  ARCHIVE_DB_PATH: /data/archive.sqlite3
  ARCHIVE_DATA_DIR: /data/archive
  ARCHIVE_INITIAL_POST_LIMIT: "-1"
  ARCHIVE_INCREMENTAL_KNOWN_POST_LIMIT: "20"
  ARCHIVE_SYNC_INTERVAL_SECONDS: "21600"
  ARCHIVE_SCHEDULE_RUN_IMMEDIATELY_ON_START: "false"
  ARCHIVE_TIMEZONE: Asia/Shanghai
  ARCHIVE_MEDIA_ENABLED: "true"
  ARCHIVE_MEDIA_MAX_BYTES: "0"
  TASK_QUEUE_ENABLED: "true"
  TASK_REDIS_URL: redis://redis:6379/0
  TASK_CRAWL_QUEUE_NAME: archivex:crawl
  TASK_MEDIA_QUEUE_NAME: archivex:media
  TASK_WORKER_QUEUE_NAME: archivex:crawl
  TASK_RESULT_TTL_SECONDS: "604800"
  TASK_RETRY_COUNT: "5"
  TASK_RETRY_DELAY_SECONDS: "30"
  TASK_RETRY_MAX_DELAY_SECONDS: "900"
  TASK_SYNC_TIMEOUT_SECONDS: "1800"
  TASK_MEDIA_TIMEOUT_SECONDS: "300"
  TASK_DEDUPE_TTL_SECONDS: "3600"
  WEB_HOST: 0.0.0.0
  WEB_PORT: "8000"
  WEB_AUTH_TOKEN: change-me-before-production
  WEB_AUTH_DISPLAY_NAME: ArchiveX 管理员
  WEB_AUTH_USERNAME: admin
  WEB_AUTH_AVATAR_URL: ""
  WEB_COOKIE_SECURE: "false"
  LOG_LEVEL: INFO

x-archivex-service: &archivex-service
  image: ghcr.io/inp146/archivex:0.1.1
  pull_policy: always
  volumes:
    - ./data:/data
  environment: *archivex-environment
  restart: unless-stopped

services:
  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    pull_policy: always
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  archivex:
    <<: *archivex-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/inp146/archivex-web:0.1.1
    pull_policy: always
    ports:
      - "8000:80"
    depends_on:
      archivex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker-crawl:
    <<: *archivex-service
    command:
      - taskiq
      - worker
      - archivex.tasks:broker
      - --workers
      - "1"
      - --max-async-tasks
      - "1"
      - --max-prefetch
      - "1"
      - --shutdown-timeout
      - "30"
    environment:
      <<: *archivex-environment
      TASK_WORKER_QUEUE_NAME: archivex:crawl
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; client = Redis.from_url(os.environ['TASK_REDIS_URL'], socket_connect_timeout=2, socket_timeout=2); assert client.get('archivex:heartbeat:crawl-worker'); client.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker-media:
    <<: *archivex-service
    command:
      - taskiq
      - worker
      - archivex.tasks:broker
      - --workers
      - "1"
      - --max-async-tasks
      - "4"
      - --max-prefetch
      - "4"
      - --shutdown-timeout
      - "30"
    environment:
      <<: *archivex-environment
      TASK_WORKER_QUEUE_NAME: archivex:media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; client = Redis.from_url(os.environ['TASK_REDIS_URL'], socket_connect_timeout=2, socket_timeout=2); assert client.get('archivex:heartbeat:media-worker'); client.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  scheduler:
    <<: *archivex-service
    command: ["taskiq", "scheduler", "archivex.tasks:scheduler"]
    environment:
      <<: *archivex-environment
      TASK_WORKER_QUEUE_NAME: archivex:crawl
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from redis import Redis; client = Redis.from_url(os.environ['TASK_REDIS_URL'], socket_connect_timeout=2, socket_timeout=2); assert client.get('archivex:heartbeat:scheduler'); client.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  tools:
    image: ghcr.io/inp146/archivex:0.1.1
    pull_policy: always
    profiles: ["tools"]
    entrypoint: ["archivex-data"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    restart: "no"

volumes:
  redis_data:
