x-archivex-environment: &archivex-environment
  TWSCRAPE_SESSION_PATH: /data/twscrape
  ARCHIVE_DB_PATH: /data/archive.sqlite3
  ARCHIVE_DATA_DIR: /data/archive
  TASK_REDIS_URL: redis://redis:6379/0
  TASK_DASHBOARD_URL: http://archivex:8000/ops/tasks
  TASK_DASHBOARD_DB_PATH: /data/taskiq-dashboard.sqlite3

x-archivex-service: &archivex-service
  build: .
  env_file:
    - .env
  volumes:
    - ./data:/data
  environment: *archivex-environment
  restart: unless-stopped

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  archivex:
    <<: *archivex-service
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker-crawl:
    <<: *archivex-service
    command:
      - taskiq
      - worker
      - archivex.tasks:broker
      - --workers
      - "1"
      - --max-async-tasks
      - "1"
      - --max-prefetch
      - "1"
      - --shutdown-timeout
      - "30"
    environment:
      <<: *archivex-environment
      TASK_REDIS_URL: redis://redis:6379/0
      TASK_DASHBOARD_URL: http://archivex:8000/ops/tasks
      TASK_WORKER_QUEUE_NAME: archivex:crawl
    depends_on:
      archivex:
        condition: service_healthy

  worker-media:
    <<: *archivex-service
    command:
      - taskiq
      - worker
      - archivex.tasks:broker
      - --workers
      - "1"
      - --max-async-tasks
      - "4"
      - --max-prefetch
      - "4"
      - --shutdown-timeout
      - "30"
    environment:
      <<: *archivex-environment
      TASK_REDIS_URL: redis://redis:6379/0
      TASK_DASHBOARD_URL: http://archivex:8000/ops/tasks
      TASK_WORKER_QUEUE_NAME: archivex:media
    depends_on:
      archivex:
        condition: service_healthy

  scheduler:
    <<: *archivex-service
    command: ["taskiq", "scheduler", "archivex.tasks:scheduler"]
    environment:
      <<: *archivex-environment
      TASK_REDIS_URL: redis://redis:6379/0
      TASK_DASHBOARD_URL: http://archivex:8000/ops/tasks
      TASK_WORKER_QUEUE_NAME: archivex:crawl
    depends_on:
      archivex:
        condition: service_healthy

volumes:
  redis_data:
