name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Version tag to validate, including completed release notes
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release.py check "$RELEASE_TAG" --require-notes
          else
            python scripts/release.py check
          fi

      - name: Install locked backend dependencies and test tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]' -c requirements.lock
          python -m pip check

      - name: Run backend tests
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate Compose templates
        run: |
          docker compose -f docker-compose.build.yml --profile tools config --quiet
          docker compose -f docker-compose.ghcr.yml --profile tools config --quiet
